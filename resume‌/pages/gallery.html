<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery - KasperLund Photography</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#faf6f1;--bg2:#f3ece3;--card:#ffffff;
  --accent:#c8553d;--accent2:#e8985e;--gold:#d4a259;
  --text:#3d2c2c;--text2:#8b7355;--text3:#b8a089;
  --shadow:0 2px 16px rgba(60,40,20,.08);
  --shadow-hover:0 8px 32px rgba(60,40,20,.15);
  --radius:12px;
  --ease:cubic-bezier(.25,.46,.45,.94);
  --body:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;
  --mono:'SF Mono','Fira Code','Cascadia Code',Consolas,monospace;
}
html{scroll-behavior:smooth}
body{font-family:var(--body);background:var(--bg);color:var(--text);line-height:1.6;font-size:16px;overflow-x:hidden}

/* ===== HEADER ===== */
.gallery-header{
  text-align:center;padding:80px 24px 48px;
  background:linear-gradient(165deg,#faf6f1 0%,#f5ebe0 40%,#fae8d4 100%);
  position:relative;overflow:hidden;
}
.gallery-header::before{
  content:'';position:absolute;top:-60%;right:-20%;width:500px;height:500px;
  background:radial-gradient(circle,rgba(200,85,61,.06) 0%,transparent 70%);
  pointer-events:none;
}
.gallery-header::after{
  content:'';position:absolute;bottom:-40%;left:-15%;width:400px;height:400px;
  background:radial-gradient(circle,rgba(212,162,89,.08) 0%,transparent 70%);
  pointer-events:none;
}
.header-content{position:relative;z-index:1;max-width:700px;margin:0 auto}
.header-label{
  display:inline-block;font-family:var(--mono);font-size:.75rem;letter-spacing:3px;
  color:var(--accent);text-transform:uppercase;margin-bottom:16px;
  padding:6px 16px;border:1px solid rgba(200,85,61,.2);border-radius:20px;
  background:rgba(200,85,61,.04);
}
.header-title{
  font-size:clamp(2.2rem,6vw,3.6rem);font-weight:800;color:var(--text);
  letter-spacing:-1px;margin-bottom:16px;line-height:1.1;
}
.header-title span{color:var(--accent)}
.header-desc{
  font-size:1.05rem;color:var(--text2);max-width:500px;margin:0 auto;line-height:1.8;
}
.header-line{
  width:60px;height:3px;background:linear-gradient(90deg,var(--accent),var(--accent2));
  margin:24px auto 0;border-radius:2px;
}

/* ===== FILTER BAR ===== */
.filter-bar{
  display:flex;flex-wrap:wrap;justify-content:center;gap:8px;
  padding:32px 24px 24px;max-width:900px;margin:0 auto;
  position:sticky;top:0;z-index:100;background:var(--bg);
}
.filter-btn{
  font-family:var(--body);font-size:.88rem;padding:8px 22px;
  border:1.5px solid rgba(139,115,85,.15);border-radius:24px;
  background:transparent;color:var(--text2);cursor:pointer;
  transition:all .3s var(--ease);font-weight:500;
}
.filter-btn:hover{
  border-color:var(--accent2);color:var(--accent);
  background:rgba(200,85,61,.04);
}
.filter-btn.active{
  background:var(--accent);color:#fff;border-color:var(--accent);
  box-shadow:0 4px 16px rgba(200,85,61,.25);
}

/* ===== MASONRY GRID ===== */
.gallery-container{max-width:1200px;margin:0 auto;padding:16px 24px 80px}
.masonry{
  column-count:3;column-gap:20px;
}

/* ===== PHOTO CARD ===== */
.photo-card{
  break-inside:avoid;margin-bottom:20px;border-radius:var(--radius);
  overflow:hidden;background:var(--card);box-shadow:var(--shadow);
  cursor:pointer;position:relative;
  opacity:0;transform:translateY(20px);
  transition:opacity .6s var(--ease),transform .6s var(--ease),box-shadow .3s;
}
.photo-card.loaded{opacity:1;transform:translateY(0)}
.photo-card:hover{box-shadow:var(--shadow-hover);transform:translateY(-4px)}
.photo-card.loaded:hover{transform:translateY(-4px)}
.photo-card.hidden{display:none}

/* placeholder gradient for demo */
.photo-placeholder{
  width:100%;display:block;
}

.photo-card img{
  width:100%;display:block;
  background:var(--bg2);
}

.photo-overlay{
  position:absolute;bottom:0;left:0;right:0;
  padding:40px 16px 16px;
  background:linear-gradient(transparent,rgba(40,25,15,.75));
  opacity:0;transition:opacity .35s;
}
.photo-card:hover .photo-overlay{opacity:1}
.photo-overlay-title{font-size:.95rem;font-weight:700;color:#fff;margin-bottom:4px}
.photo-overlay-info{font-size:.78rem;color:rgba(255,255,255,.75);font-family:var(--mono)}

/* ===== LIGHTBOX ===== */
.lightbox{
  position:fixed;top:0;left:0;width:100%;height:100%;z-index:10000;
  background:rgba(30,20,15,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  display:none;align-items:center;justify-content:center;flex-direction:column;
  opacity:0;transition:opacity .4s;
}
.lightbox.open{display:flex;opacity:1}
.lightbox-close{
  position:absolute;top:20px;right:24px;width:44px;height:44px;
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);
  border-radius:50%;color:#fff;font-size:22px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .2s;z-index:10001;
}
.lightbox-close:hover{background:rgba(255,255,255,.2);transform:scale(1.1)}
.lightbox-img-wrap{
  max-width:90vw;max-height:70vh;position:relative;
  display:flex;align-items:center;justify-content:center;
}
.lightbox-img-wrap img{
  max-width:100%;max-height:70vh;border-radius:8px;
  box-shadow:0 20px 60px rgba(0,0,0,.4);
  object-fit:contain;
}
.lightbox-img-wrap .photo-placeholder{
  max-width:80vw;max-height:70vh;border-radius:8px;
  box-shadow:0 20px 60px rgba(0,0,0,.4);
}
.lightbox-info{
  text-align:center;padding:24px;max-width:600px;
}
.lightbox-title{font-size:1.2rem;font-weight:700;color:#fff;margin-bottom:8px}
.lightbox-meta{
  display:flex;flex-wrap:wrap;justify-content:center;gap:16px;
  font-size:.82rem;color:rgba(255,255,255,.6);font-family:var(--mono);
}
.lightbox-meta span::before{
  content:'';display:inline-block;width:4px;height:4px;
  background:var(--accent2);border-radius:50%;margin-right:6px;vertical-align:middle;
}
.lightbox-nav{
  position:absolute;top:50%;transform:translateY(-50%);
  width:48px;height:48px;background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.12);border-radius:50%;
  color:#fff;font-size:20px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .2s;
}
.lightbox-nav:hover{background:rgba(255,255,255,.18)}
.lightbox-prev{left:24px}
.lightbox-next{right:24px}
.lightbox-counter{
  position:absolute;top:24px;left:24px;font-family:var(--mono);
  font-size:.82rem;color:rgba(255,255,255,.5);
}

/* ===== FOOTER ===== */
.gallery-footer{
  text-align:center;padding:40px 24px;color:var(--text3);
  font-size:.82rem;font-family:var(--mono);border-top:1px solid rgba(139,115,85,.1);
}

/* ===== RESPONSIVE ===== */
@media(max-width:900px){
  .masonry{column-count:2}
  .lightbox-prev{left:12px}
  .lightbox-next{right:12px}
}
@media(max-width:560px){
  .masonry{column-count:1;max-width:400px;margin:0 auto}
  .gallery-header{padding:60px 20px 36px}
  .gallery-container{padding:12px 16px 60px}
  .filter-bar{padding:20px 16px 16px}
  .lightbox-nav{width:36px;height:36px;font-size:16px}
  .lightbox-prev{left:8px}
  .lightbox-next{right:8px}
}

/* ===== SCROLL ANIMATION ===== */
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>

<!-- Gallery Header -->
<header class="gallery-header">
  <div class="header-content">
    <span class="header-label">Photography</span>
    <h1 class="header-title">My <span>Gallery</span></h1>
    <p class="header-desc">
      用镜头记录生活中的光影瞬间，<br>
      每一张照片都是一段故事。
    </p>
    <div class="header-line"></div>
  </div>
</header>

<!-- Filter Bar -->
<div class="filter-bar" id="filterBar">
  <button class="filter-btn active" data-filter="all">All</button>
  <button class="filter-btn" data-filter="landscape">Landscape</button>
  <button class="filter-btn" data-filter="portrait">Portrait</button>
  <button class="filter-btn" data-filter="street">Street</button>
  <button class="filter-btn" data-filter="life">Life</button>
</div>

<!-- Masonry Gallery -->
<div class="gallery-container">
  <div class="masonry" id="masonry">
    <!-- Cards are generated by JS from the photos array -->
  </div>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lbClose">&times;</button>
  <span class="lightbox-counter" id="lbCounter"></span>
  <button class="lightbox-nav lightbox-prev" id="lbPrev">&#10094;</button>
  <button class="lightbox-nav lightbox-next" id="lbNext">&#10095;</button>
  <div class="lightbox-img-wrap" id="lbImgWrap"></div>
  <div class="lightbox-info">
    <div class="lightbox-title" id="lbTitle"></div>
    <div class="lightbox-meta" id="lbMeta"></div>
  </div>
</div>

<!-- Footer -->
<footer class="gallery-footer">
  &copy; 2025 KasperLund &middot; All photos taken by me (probably)
</footer>

<!-- Theme Nav -->
<div id="themeNav" style="position:fixed;bottom:24px;right:24px;z-index:9999;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif">
<button onclick="document.getElementById('themePanel').style.display=document.getElementById('themePanel').style.display==='flex'?'none':'flex'" style="width:48px;height:48px;border-radius:50%;border:2px solid rgba(60,40,20,.15);background:rgba(250,246,241,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:var(--accent,#c8553d);font-size:20px;cursor:pointer;box-shadow:0 4px 20px rgba(60,40,20,.12);transition:all .3s;display:flex;align-items:center;justify-content:center" onmouseenter="this.style.transform='scale(1.1)'" onmouseleave="this.style.transform='scale(1)'">&#9776;</button>
<div id="themePanel" style="display:none;position:absolute;bottom:60px;right:0;flex-direction:column;gap:6px;background:rgba(250,246,241,.97);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(60,40,20,.1);border-radius:12px;padding:12px 14px;min-width:120px;box-shadow:0 8px 32px rgba(60,40,20,.15)">
<a href="../index.html" style="color:#c8553d;text-decoration:none;font-size:.85rem;padding:8px 12px;border-radius:6px;transition:background .2s;font-weight:600;white-space:nowrap" onmouseenter="this.style.background='rgba(200,85,61,.06)'" onmouseleave="this.style.background='transparent'">&#8592; Back to Home</a>
<div style="height:1px;background:rgba(60,40,20,.08);margin:4px 0"></div>
<a href="../indexs/light.html" style="color:#3d2c2c;text-decoration:none;font-size:.82rem;padding:6px 12px;border-radius:6px;transition:background .2s;white-space:nowrap" onmouseenter="this.style.background='rgba(60,40,20,.05)'" onmouseleave="this.style.background='transparent'">&#9728;&#65039; Light</a>
<a href="../indexs/gradient.html" style="color:#3d2c2c;text-decoration:none;font-size:.82rem;padding:6px 12px;border-radius:6px;transition:background .2s;white-space:nowrap" onmouseenter="this.style.background='rgba(60,40,20,.05)'" onmouseleave="this.style.background='transparent'">&#127752; Gradient</a>
<a href="../indexs/pixel.html" style="color:#3d2c2c;text-decoration:none;font-size:.82rem;padding:6px 12px;border-radius:6px;transition:background .2s;white-space:nowrap" onmouseenter="this.style.background='rgba(60,40,20,.05)'" onmouseleave="this.style.background='transparent'">&#127918; Pixel</a>
<a href="../indexs/scifi.html" style="color:#3d2c2c;text-decoration:none;font-size:.82rem;padding:6px 12px;border-radius:6px;transition:background .2s;white-space:nowrap" onmouseenter="this.style.background='rgba(60,40,20,.05)'" onmouseleave="this.style.background='transparent'">&#128640; Sci-Fi</a>
</div>
</div>

<script>
(function(){
'use strict';

/* ========================================================================
   PHOTO DATA
   =========================================================================
   Replace `src` with real image paths like '../images/gallery/photo01.jpg'
   and update title / location / date / camera / category as needed.
   The `placeholder` field controls the CSS gradient color for demo cards.
   Remove `placeholder` once you set a real `src`.
   ======================================================================== */
var photos = [
  { src:'', placeholder:'linear-gradient(135deg,#f5cba7,#e8985e)', height:320, title:'Golden Hour', location:'Beijing, China', date:'2025.03', camera:'Sony A7M4 | 35mm f/1.4', category:'landscape' },
  { src:'', placeholder:'linear-gradient(135deg,#d4a259,#c8553d)', height:420, title:'Old Alley', location:'Xian, China', date:'2025.01', camera:'Fuji X-T5 | 23mm f/2', category:'street' },
  { src:'', placeholder:'linear-gradient(135deg,#f3ece3,#d4a259)', height:280, title:'Morning Coffee', location:'Home', date:'2025.04', camera:'iPhone 15 Pro', category:'life' },
  { src:'', placeholder:'linear-gradient(135deg,#e8985e,#f5cba7)', height:380, title:'Portrait of Light', location:'Studio', date:'2025.02', camera:'Sony A7M4 | 85mm f/1.8', category:'portrait' },
  { src:'', placeholder:'linear-gradient(135deg,#c8553d,#d4a259)', height:300, title:'Mountain Mist', location:'Qinling, China', date:'2024.11', camera:'Sony A7M4 | 24-70mm', category:'landscape' },
  { src:'', placeholder:'linear-gradient(135deg,#b8a089,#f3ece3)', height:260, title:'Street Cat', location:'Chengdu, China', date:'2025.03', camera:'Fuji X-T5 | 56mm f/1.2', category:'street' },
  { src:'', placeholder:'linear-gradient(135deg,#f5cba7,#c8553d)', height:440, title:'Sunset Silhouette', location:'Sanya, China', date:'2024.12', camera:'Sony A7M4 | 70-200mm', category:'portrait' },
  { src:'', placeholder:'linear-gradient(135deg,#d4a259,#b8a089)', height:290, title:'Weekend Market', location:'Beijing, China', date:'2025.05', camera:'Ricoh GR3', category:'life' },
  { src:'', placeholder:'linear-gradient(135deg,#e8985e,#c8553d)', height:360, title:'Rain Reflection', location:'Shanghai, China', date:'2025.02', camera:'Fuji X-T5 | 23mm f/2', category:'street' },
  { src:'', placeholder:'linear-gradient(135deg,#f3ece3,#e8985e)', height:310, title:'Autumn Path', location:'Xiangshan, Beijing', date:'2024.10', camera:'Sony A7M4 | 35mm f/1.4', category:'landscape' },
  { src:'', placeholder:'linear-gradient(135deg,#c8553d,#f5cba7)', height:350, title:'Smile', location:'Park', date:'2025.04', camera:'Sony A7M4 | 85mm f/1.8', category:'portrait' },
  { src:'', placeholder:'linear-gradient(135deg,#b8a089,#d4a259)', height:270, title:'Late Night Coding', location:'Home', date:'2025.06', camera:'iPhone 15 Pro', category:'life' },
];

/* ========== RENDER CARDS ========== */
var masonry = document.getElementById('masonry');

function renderCards(filter){
  masonry.innerHTML = '';
  var filtered = filter === 'all' ? photos : photos.filter(function(p){ return p.category === filter; });
  filtered.forEach(function(photo, idx){
    var card = document.createElement('div');
    card.className = 'photo-card';
    card.setAttribute('data-index', photos.indexOf(photo));
    card.setAttribute('data-category', photo.category);

    var imgHTML;
    if(photo.src){
      imgHTML = '<img src="' + photo.src + '" alt="' + photo.title + '" loading="lazy">';
    } else {
      imgHTML = '<div class="photo-placeholder" style="height:' + photo.height + 'px;background:' + photo.placeholder + '"></div>';
    }

    card.innerHTML = imgHTML +
      '<div class="photo-overlay">' +
        '<div class="photo-overlay-title">' + photo.title + '</div>' +
        '<div class="photo-overlay-info">' + photo.location + ' &middot; ' + photo.date + '</div>' +
      '</div>';

    card.addEventListener('click', function(){ openLightbox(parseInt(this.getAttribute('data-index'))); });
    masonry.appendChild(card);
  });

  // Observe for lazy load / fade in
  observeCards();
}

/* ========== LAZY LOAD / FADE IN ========== */
var cardObs;
function observeCards(){
  var cards = document.querySelectorAll('.photo-card:not(.loaded)');
  if('IntersectionObserver' in window){
    if(cardObs) cardObs.disconnect();
    cardObs = new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if(e.isIntersecting){
          setTimeout(function(){ e.target.classList.add('loaded'); }, 60);
          cardObs.unobserve(e.target);
        }
      });
    }, {threshold:0.05, rootMargin:'0px 0px 100px 0px'});
    cards.forEach(function(c){ cardObs.observe(c); });
  } else {
    cards.forEach(function(c){ c.classList.add('loaded'); });
  }
}

/* ========== FILTER ========== */
var filterBtns = document.querySelectorAll('.filter-btn');
filterBtns.forEach(function(btn){
  btn.addEventListener('click', function(){
    filterBtns.forEach(function(b){ b.classList.remove('active'); });
    this.classList.add('active');
    renderCards(this.getAttribute('data-filter'));
  });
});

/* ========== LIGHTBOX ========== */
var lightbox = document.getElementById('lightbox');
var lbImgWrap = document.getElementById('lbImgWrap');
var lbTitle = document.getElementById('lbTitle');
var lbMeta = document.getElementById('lbMeta');
var lbCounter = document.getElementById('lbCounter');
var lbClose = document.getElementById('lbClose');
var lbPrev = document.getElementById('lbPrev');
var lbNext = document.getElementById('lbNext');
var currentIdx = 0;

function openLightbox(idx){
  currentIdx = idx;
  updateLightbox();
  lightbox.style.display = 'flex';
  requestAnimationFrame(function(){ lightbox.classList.add('open'); });
  document.body.style.overflow = 'hidden';
}

function closeLightbox(){
  lightbox.classList.remove('open');
  setTimeout(function(){ lightbox.style.display = 'none'; }, 300);
  document.body.style.overflow = '';
}

function updateLightbox(){
  var photo = photos[currentIdx];
  if(photo.src){
    lbImgWrap.innerHTML = '<img src="' + photo.src + '" alt="' + photo.title + '">';
  } else {
    lbImgWrap.innerHTML = '<div class="photo-placeholder" style="width:min(80vw,600px);height:min(60vh,450px);border-radius:8px;background:' + photo.placeholder + '"></div>';
  }
  lbTitle.textContent = photo.title;
  lbMeta.innerHTML = '<span>' + photo.location + '</span><span>' + photo.date + '</span><span>' + photo.camera + '</span>';
  lbCounter.textContent = (currentIdx + 1) + ' / ' + photos.length;
}

function prevPhoto(){
  currentIdx = (currentIdx - 1 + photos.length) % photos.length;
  updateLightbox();
}
function nextPhoto(){
  currentIdx = (currentIdx + 1) % photos.length;
  updateLightbox();
}

lbClose.addEventListener('click', closeLightbox);
lbPrev.addEventListener('click', function(e){ e.stopPropagation(); prevPhoto(); });
lbNext.addEventListener('click', function(e){ e.stopPropagation(); nextPhoto(); });
lightbox.addEventListener('click', function(e){
  if(e.target === lightbox) closeLightbox();
});
document.addEventListener('keydown', function(e){
  if(lightbox.style.display !== 'flex') return;
  if(e.key === 'Escape') closeLightbox();
  if(e.key === 'ArrowLeft') prevPhoto();
  if(e.key === 'ArrowRight') nextPhoto();
});

/* ========== INIT ========== */
renderCards('all');

})();
</script>
</body>
</html>
